name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build-site.py'
      - 'tools/generate_og_images.py'
      - 'tools/validate-site-proof.py'
      - 'tools/lib/**'
      - 'packages/proof-engine-registry/**'  # build-site imports from this package
      - 'docs/DESIGN.md'
      - 'proof-engine/skills/proof-engine/references/hardening-rules.md'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Jinja2 Markdown Pygments PyYAML bleach Pillow pymdown-extensions regex unidecode requests

      - name: Install monorepo subpackages
        # tools/build-site.py imports from proof_engine_registry.emit since v1.28.
        # Without this, the build crashes with ModuleNotFoundError.
        run: pip install -e packages/proof-citations -e packages/proof-engine-registry -e packages/proof-engine-wiki

      - name: Validate all proofs (structural only — provenance checked in PR)
        run: |
          for dir in site/proofs/*/; do
            [ -f "$dir/proof.json" ] || continue
            echo "=== Validating $dir ==="
            python tools/validate-site-proof.py --structural-only "$dir"
          done

      - name: Build site
        run: |
          python tools/build-site.py \
            --site-dir site \
            --output-dir _site \
            --base-url / \
            --site-url https://proofengine.info \
            --design-md docs/DESIGN.md \
            --hardening-rules-md proof-engine/skills/proof-engine/references/hardening-rules.md \
            --commit-sha "${GITHUB_SHA}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
